name: Verify and build release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare Android tools
        run: |
          python3 tools/ci_run.py android-sdk sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare pinned test inputs
        run: |
          mkdir -p .scratch
          python3 -m venv .scratch/ci-python
          python3 tools/ci_run.py python-dependencies .scratch/ci-python/bin/python -m pip install PyYAML
          python3 tools/ci_run.py vision-models .scratch/ci-python/bin/python tools/fetch_vision_models.py
          python3 tools/ci_run.py translation-sources .scratch/ci-python/bin/python tools/fetch_translation_sources.py
      - name: Check localization
        run: python3 tools/ci_run.py localization python3 tools/test_ui_translations.py
      - name: Build, test and lint
        run: |
          chmod +x gradlew
          python3 tools/ci_run.py debug-tests ./gradlew :app:assembleDebug :app:lintDebug test --max-workers=2 --no-parallel -Dorg.gradle.jvmargs=-Xmx4g --console=plain
          python3 tools/ci_run.py release ./gradlew :app:assembleRelease :app:lintRelease --max-workers=2 --no-parallel -Dorg.gradle.jvmargs=-Xmx4g --console=plain --stacktrace
          python3 tools/ci_run.py native-jni .scratch/ci-python/bin/python tools/verify_native_jni.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-unsigned
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            app/build/reports/
            app/build/test-results/
            core/*/build/reports/
            core/*/build/test-results/
            .scratch/ci-logs/
      # The downloaded APK is signed locally with the existing release key.
