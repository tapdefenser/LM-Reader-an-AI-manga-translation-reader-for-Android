# 版本目录 — 全仓库依赖版本的唯一来源。
#
# 版本不是"追新"结果：AGP/Kotlin/KSP/Compose BOM 与本机已验证的
# LM-translator 构建栈保持一致（AGP 9.2.1 + Kotlin 2.3.21 + Gradle 9.6.1），
# 避免在搭建阶段同时引入工具链风险。升级需整组评估。

[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.12"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
litert = "2.2.0"
onnxruntime = "1.28.0"
onnxruntimeQnn = "2.6.0"
qnnRuntime = "2.50.0"
exifinterface = "1.4.2"

# AndroidX
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
composeBom = "2026.09.00"
materialIcons = "1.7.8"
room = "2.8.5"
datastore = "1.2.1"
documentfile = "1.1.0"
paging = "3.5.1"
media3 = "1.11.1"

# 图片加载（封面）：Coil 3 为 Compose 优先分支，支持通过自定义 Fetcher 接入 SAF。
coil = "3.4.0"

# 阅读器图片引擎：Mihon 使用的 SubsamplingScaleImageView fork。
# 缩放/平移/分块解码/裁白边/双击焦点都在这个库里，Mihon 源码只设属性（见 settings.gradle.kts）。
# 版本号是 commit hash，JitPack 按其缓存构建；仓库已收窄到 com.github.mihonapp 一个 group。
subsamplingScaleImageView = "94915e6f73"

# 测试
junit4 = "4.13.2"
kotlinxCoroutinesTest = "1.10.2"
turbine = "1.2.1"
mockk = "1.14.9"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# Kotlin 基础
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-qnn = { module = "com.qualcomm.qti:onnxruntime-android-qnn", version.ref = "onnxruntimeQnn" }
qnn-runtime = { module = "com.qualcomm.qti:qnn-runtime", version.ref = "qnnRuntime" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# AndroidX 核心
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# 图片加载
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# 阅读器图片引擎（JitPack；见 settings.gradle.kts 的说明与仓库收窄）
# 含 native libssiv_crop.so（裁白边），APK 会带四种 ABI 的该库。
subsampling-scale-image-view = { module = "com.github.mihonapp:subsampling-scale-image-view", version.ref = "subsamplingScaleImageView" }

# 测试
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# build-logic 约定插件的编译期依赖（不进入任何 APK）
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

[plugins]
# 本项目约定插件（build-logic/convention）
lmreader-android-application = { id = "lmreader.android.application" }
lmreader-android-library = { id = "lmreader.android.library" }
lmreader-android-library-compose = { id = "lmreader.android.library.compose" }
lmreader-android-library-room = { id = "lmreader.android.library.room" }
lmreader-jvm-library = { id = "lmreader.jvm.library" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
